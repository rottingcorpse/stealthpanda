name: "CLA Assistant"
on:
  # STEALTHPANDA: automated runs are disabled in this fork — CI runs
  # locally via tools/ci-local.sh. Manual runs from the Actions tab
  # stay possible. Restore upstream's `on:` block on future merges to
  # re-enable.
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_GH_PAT }}
        with:
          path-to-signatures: 'signatures/browser/version1/cla.json'
          path-to-document: 'https://github.com/lightpanda-io/browser/blob/main/CLA.md'
          # branch should not be protected
          branch: 'main'
          allowlist: krichprollsch,francisbouvier,katie-lpd,sjorsdonkers,bornlex

          remote-organization-name: lightpanda-io
          remote-repository-name: cla
